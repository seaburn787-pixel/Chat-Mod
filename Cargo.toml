[package]
name = "chat-mod"
version = "0.1.0"
edition = "2024"
description = "YouTube + Twitch live chat viewer that flags messages against word lists"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
egui_extras = { version = "0.36", features = ["http", "image", "webp", "gif"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "1"
directories = "6"
unicode-normalization = "0.1"
chrono = "0.4"
sha1_smol = { version = "1", features = ["std"] }

# Linux display backends for the eventual Mint build (glow renderer above).
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
