# Builds the Windows exe and attaches it to a GitHub Release.
#
# To publish a version: bump `version` in Cargo.toml, commit, then push a tag:
#   git tag v0.2.0
#   git push origin v0.2.0
# The release appears under Releases a few minutes later with chat-mod.exe
# and a zip attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/chat-mod.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath chat-mod-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Chat Mod ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/chat-mod.exe
            chat-mod-windows-x64.zip

      # Manual runs (Actions tab -> Run workflow) just produce a downloadable
      # build artifact, without making a release.
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-mod-windows-x64
          path: chat-mod-windows-x64.zip
